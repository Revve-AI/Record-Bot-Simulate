name: Development - Build & Deploy Record-Bot-Simulate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "input/**"

concurrency:
  group: deploy-recorder-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: asia-southeast1-docker.pkg.dev/revve-infra-dev/revve-dev
  IMAGE_NAME: record-bot-simulate
  PROJECT_ID: revve-infra-dev
  ZONE: asia-southeast1-a
  VM_NAME: dev-recorder-asia-southeast1
  WORKLOAD_IDENTITY_PROVIDER: projects/718316475499/locations/global/workloadIdentityPools/oidc-pool/providers/oidc-provider
  SERVICE_ACCOUNT: image-puller@revve-infra-dev.iam.gserviceaccount.com

jobs:
  build-and-push:
    name: Build image and push to Artifact Registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.set-env.outputs.image_tag }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Capture commit metadata
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: set-env
        run: |
          IMAGE_TAG="dev-${{ steps.commit.outputs.short_sha }}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          audience: https://github.com/Revve-AI

      - name: Configure Docker auth for Artifact Registry
        run: |
          REGISTRY_HOST="${REGISTRY%%/*}"
          gcloud auth configure-docker "${REGISTRY_HOST}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (tags: dev-<sha>, dev-latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          cache-from: type=gha,scope=recorder-dev
          cache-to: type=gha,mode=max,scope=recorder-dev

  deploy:
    name: Deploy to VM via IAP
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          audience: https://github.com/Revve-AI

      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Copy compose + deploy script to VM
        run: |
          gcloud compute scp \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            docker-compose.yml scripts/deploy.sh \
            ${{ env.VM_NAME }}:/mnt/data/recorder/

      - name: Run deploy script on VM
        run: |
          gcloud compute ssh \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            ${{ env.VM_NAME }} \
            --command='chmod +x /mnt/data/recorder/deploy.sh && /mnt/data/recorder/deploy.sh'

      - name: Health check
        run: |
          gcloud compute ssh \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            ${{ env.VM_NAME }} \
            --command='
              for i in {1..20}; do
                if curl -fsS http://127.0.0.1:7860 >/dev/null 2>&1; then
                  echo "Recorder up on attempt $i"
                  docker ps --filter "name=record-bot-simulate" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
                  exit 0
                fi
                sleep 3
              done
              echo "Recorder did not come up in time" >&2
              docker logs --tail=80 record-bot-simulate || true
              exit 1
            '
