name: Development - Deploy Record-Bot-Simulate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "input/**"

concurrency:
  group: deploy-recorder-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: revve-infra-dev
  ZONE: asia-southeast1-a
  VM_NAME: dev-recorder-asia-southeast1
  WORKLOAD_IDENTITY_PROVIDER: projects/718316475499/locations/global/workloadIdentityPools/oidc-pool/providers/oidc-provider
  SERVICE_ACCOUNT: image-puller@revve-infra-dev.iam.gserviceaccount.com

jobs:
  deploy:
    name: Rsync to VM and restart service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Capture commit metadata
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          audience: https://github.com/Revve-AI

      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Bootstrap VM (idempotent)
        run: |
          gcloud compute ssh \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            ${{ env.VM_NAME }} \
            --command='sudo bash -s' < scripts/setup-vm.sh

      - name: Package release tarball
        run: |
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./input' \
              --exclude='./output' \
              --exclude='./__pycache__' \
              --exclude='./.venv' \
              --exclude='./node_modules' \
              -czf /tmp/release.tar.gz -C . .
          ls -lh /tmp/release.tar.gz

      - name: Upload release tarball to VM
        run: |
          gcloud compute scp \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            /tmp/release.tar.gz \
            ${{ env.VM_NAME }}:/tmp/release.tar.gz

      - name: Extract release and run deploy script
        env:
          SHA: ${{ steps.commit.outputs.short_sha }}
        run: |
          gcloud compute ssh \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            ${{ env.VM_NAME }} \
            --command="
              set -euxo pipefail
              SHA='${SHA}'
              ROOT=/mnt/data/recorder
              RELEASE_DIR=\"\$ROOT/releases/\$SHA\"
              sudo install -d -o recorder -g recorder \"\$RELEASE_DIR\"
              sudo tar -xzf /tmp/release.tar.gz -C \"\$RELEASE_DIR\"
              sudo rm -f /tmp/release.tar.gz
              sudo RELEASE_SHA=\"\$SHA\" bash \"\$RELEASE_DIR/scripts/deploy.sh\"
            "

      - name: Health check
        run: |
          gcloud compute ssh \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            ${{ env.VM_NAME }} \
            --command='
              for i in {1..20}; do
                if curl -fsS http://127.0.0.1:7860 >/dev/null 2>&1; then
                  echo "Recorder up on attempt $i"
                  systemctl status record-bot-simulate --no-pager | head -20
                  exit 0
                fi
                sleep 3
              done
              echo "Recorder did not come up in time" >&2
              sudo journalctl -u record-bot-simulate -n 80 --no-pager || true
              exit 1
            '
